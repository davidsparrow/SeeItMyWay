<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bramble &amp; Co. opening hours (still page)</title>
    <!--
      The scanner's "nothing to adapt" calibration page: nothing moves and every piece of text
      already meets 7:1 contrast, so rubric v2 treats reduced motion and contrast as not
      applicable. Keep it that way: no @keyframes, smooth scrolling, video or grey text.
    -->
    <style>
      body {
        margin: 0 auto;
        max-width: 40rem;
        padding: 2rem 1rem;
        font: 1.125rem/1.6 system-ui, sans-serif;
        color: #111;
        background: #fff;
      }
      a {
        color: #0b3d91;
        /* A colour transition isn't motion the rubric counts. */
        transition: color 0.2s;
      }
      .note {
        padding: 1rem;
        /* Semi-transparent: the collector composites it over the page background. */
        background: rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>
  <body>
    <h1>Bramble &amp; Co.</h1>
    <p>Handmade ceramics from a small studio.</p>
    <h2>Opening hours</h2>
    <ul>
      <li>Tuesday to Friday: 10:00 to 17:00</li>
      <li>Saturday: 9:00 to 13:00</li>
      <li>Sunday and Monday: closed</li>
    </ul>
    <p class="note">The studio is up one flight of stairs. Ring the bell and we'll come down.</p>
    <p><a href="index.html">Back to the shop</a></p>
  </body>
</html>
